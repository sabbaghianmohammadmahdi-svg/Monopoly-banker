html,body{margin:0;background:var(--bg);color:var(--ink);font-family:IRANSansX,Tahoma,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:6px 0 14px}
b{font-weight:700}
.c{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
button,input{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:12px 16px;background:#c8302b;color:#fff;font-weight:700;width:100%;font-size:16px}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.sm{font-size:13px;padding:8px 12px;width:auto}
.top3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:6px 0 10px}
.top3 h1{margin:0;font-size:22px}
.top3>:first-child{justify-self:start}.top3>:last-child{justify-self:end}
.top3 button.sm{display:flex;padding:10px 12px}
.q{text-align:center;color:var(--mut);margin:0 0 10px}
.menu{position:absolute;top:100%;inset-inline-end:0;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:150px;z-index:7;box-shadow:0 6px 20px #0003}
.menu button{display:block;width:100%;padding:12px 14px;background:none;border:0;text-align:start}
.bd{position:fixed;inset:0;z-index:6}
.bankc{text-align:center;font-size:22px;font-weight:700;color:#fff;cursor:pointer;padding:16px;background:linear-gradient(145deg,#3a3a3a,#000);border:1px solid #ffffff33;text-shadow:0 1px 3px #0008}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(110px,1fr);gap:10px;flex:1}
.sq{margin:0;display:flex;flex-direction:column;align-items:center;padding:14px 6px;text-align:center;cursor:pointer;color:#fff;border:1px solid #ffffff55;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 6px 18px #0002,inset 0 1px 0 #ffffff44;backdrop-filter:blur(6px);text-shadow:0 1px 3px #0005;min-height:0}
.sq:last-child:nth-child(odd){grid-column:1/-1}

.sq b{font-size:18px}
.sq .bal{margin:auto 0;font-size:clamp(32px,11vw,52px);font-weight:900;line-height:1.1;white-space:nowrap}
.sq .bal.big{font-size:clamp(26px,9vw,42px)}
.sq.out{background:linear-gradient(145deg,#9a9fa9,#6b707b);filter:grayscale(1);opacity:.65;cursor:not-allowed;color:#fff}
.sq.out .bal{font-size:20px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ft{margin-top:auto;padding-top:18px;text-align:center;font-size:11px;color:var(--mut);line-height:1.8}
.opt{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%;padding:22px 14px;margin-bottom:12px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.opt b{font-size:18px}.opt span{font-size:13px;color:var(--mut)}
.sheet{position:fixed;inset:0;background:#0007;backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 6px);overflow:auto;display:flex;flex-direction:column}
.sh>*{flex:none}
.sh>.kp{flex:1 1 230px;min-height:170px}
.sheet.ctr{align-items:center;padding:12px}
.sheet.ctr .sh{border-radius:22px;max-width:340px;padding:18px 16px}
.pd{display:flex;justify-content:center;gap:14px;margin:14px 0}
.pd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}
.pd i.f{background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.4}
.fld{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px;font-size:16px;min-height:46px;cursor:pointer}
.brow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.brow .card{margin:0;padding:16px 4px;text-align:center;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.brow .bankc{font-size:18px}
.cc.chance{background:linear-gradient(145deg,#fffaf0,#e6d9b8);color:#1d2433;border:1px solid #cdbf98}
.cc.chest{background:linear-gradient(145deg,#ffe45e,#f2c200);color:#1d2433;border:1px solid #d9ad00}
.cardw{width:min(310px,88vw);border-radius:22px;padding:16px;text-align:center;box-shadow:0 12px 40px #0006;color:#1d2433}
.cardw.chance{background:linear-gradient(145deg,#fffaf0,#e6d9b8)}
.cardw.chest{background:linear-gradient(145deg,#ffe45e,#f2c200)}
.cardw.spin{animation:shk .14s infinite}
.ct{font-size:22px;font-weight:900}
.reel{height:200px;overflow:hidden;border-radius:14px;background:#fffdf5;margin:12px 0;border:3px double #1d2433}
.reel.mv{filter:blur(1.2px)}
.ci2{height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 14px;font-weight:700;line-height:1.7;overflow:hidden}
.strip{will-change:transform}
.sp{font-size:13px;opacity:.7}
.elist{overflow:auto;min-height:0}
.sh>.elist{flex:1 1 auto}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;resize:none;color:inherit}
@keyframes shk{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}

.chip.on{background:var(--ink);color:var(--bg)}
.chips.dn .chip{padding:5px 11px;font-size:13px}
.qrow{display:flex;gap:5px;margin:8px 0}
.qrow .chip{flex:1;padding:10px 2px;font-size:14px;white-space:nowrap}
.amt{font-size:clamp(38px,8vh,58px);font-weight:900;text-align:center;margin:8px 0;padding:8px;min-height:clamp(62px,11vh,100px);display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--card);border:1px solid var(--line);direction:ltr}
.kp{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(38px,1fr));gap:8px;margin:0 0 10px;direction:ltr}

.fpi{margin:12px 0;color:var(--mut)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:20px;z-index:12;font-weight:700;font-size:14px;max-width:92vw;text-align:center}
.toast.ok{background:#1f8a4c;color:#fff}.toast.err{background:#d03a34;color:#fff}
.ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#0006;backdrop-filter:blur(5px);overflow:hidden}
.win{position:relative;z-index:1;width:min(320px,86vw);background:var(--card);border-radius:22px;padding:22px 18px 14px;text-align:center;box-shadow:0 12px 40px #0006;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win .ft{margin-top:14px;padding-top:0}
.tr{font-size:64px;animation:bn 1s ease-in-out infinite}
.wt{font-size:22px;font-weight:900;margin:8px 0 16px}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes bn{50%{transform:translateY(-10px) scale(1.08)}}
.toast{display:flex;align-items:center;gap:10px;background:rgba(29,36,51,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 28px rgba(0,0,0,.25);border-radius:18px;animation:tin .25s ease-out}
.toast.ok{background:rgba(31,138,76,.72)}.toast.err{background:rgba(208,58,52,.72)}
.tu{border:1px solid #fff8;background:#ffffff30;color:#fff;border-radius:12px;padding:4px 12px;font-weight:700}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.chip.red{background:#d03a34;color:#fff;border-color:#d03a34}.chip.red.on{background:#a82520;box-shadow:0 0 0 3px #d03a3466}
.hi{padding:10px 0;border-bottom:2px solid var(--mut);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px}
.hi button{font-size:12px;padding:6px 10px;flex:none}.hdn{opacity:.5;text-decoration:line-through}.mft{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);text-align:center;line-height:1.8}
.jb{display:inline-flex;gap:6px;align-items:center;background:#0004;border:1px solid #fff6;border-radius:12px;padding:2px 8px;font-size:11px;margin-top:4px}
.jb i{font-style:normal;background:#fff3;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.brow.two{grid-template-columns:1fr 1fr}
.brow .mnch{background:linear-gradient(145deg,#2e9e4f,#1b6b35);color:#fff;border:0}.brow .qpay{background:linear-gradient(145deg,#1e66f5,#1445b0);color:#fff;border:0}
.cardw.dice{background:linear-gradient(145deg,#d9f2e0,#8fd1a4)}
.dreel{height:130px;overflow:hidden;border-radius:16px;background:#fffdf5;border:3px double #1d2433;margin:12px 0}
.dci{height:130px;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:900;color:#1d2433}
.ord{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px}
.ord b{flex:1}.ord button{width:36px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
</style>

function toast(m,t){ui.msg=m;ui.mt=t||"";render();clearTimeout(toast.k);toast.k=setTimeout(function(){ui.msg=null;render()},2200)}
function render(){
var h;
if(S.players.length)h=main();else if(ui.screen==="mode")h=modeScr();else if(ui.screen==="method")h=methodScr();else h=startScr();

var DEF={chance:[

function cards(d){var c=S.cards&&S.cards[d];return(c&&c.length===16)?c:DEF[d]}
function drawCard(d){
S.dk=S.dk||{};S.lc=S.lc||{};var q=S.dk[d];
if(!q||!q.length){q=[];for(var i=0;i<16;i++)q.push(i);for(var j=15;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=q[j];q[j]=q[k];q[k]=t}

function doCard(d){
var idx=drawCard(d),seq=[];for(var i=0;i<28;i++)seq.push(Math.floor(Math.random()*16));seq.push(idx);

function txSheet(){var al=oth(),ids=(al.length>1?["all"]:[]).concat(["bank"]).concat(S.players.filter(function(p){return !p.out&&p.id!==tx.from}).map(function(p){return p.id}));

h+='</div><div class="amt">'+fmt(+tx.amt||0)+'</div>'+(tx.to==="all"&&tx.amt?'<div class="h c" style="border:0;padding:0 0 4px">مجموع از حساب: '+fmt(+tx.amt*al.length)+'</div>':'')+(tx.to==="collect"&&tx.amt?'<div class="h c" style="border:0;padding:0 0 4px">مجموع دریافتی: '+fmt(+tx.amt*al.length)+' (از '+fa(al.length)+' نفر)</div>':'')+'<div class="qrow">';

function pay(){var a=+tx.amt;if(!tx.to){toast("گیرنده را انتخاب کنید");return}if(!a){toast("مبلغ را وارد کنید");return}
var f=gp(tx.from),al=oth();
if(tx.to==="collect"){var lo=al.filter(function(p){return p.bal<a});if(lo.length){toast(lo.map(function(p){return p.name}).join("، ")+": موجودی کافی نیست","err");return}}
else{var n=tx.to==="all"?al.length:1;if(f&&f.bal<a*n){toast("موجودی کافی نیست","err");return}}
if(tx.authed)doPay();else guard(doPay)}
function doPay(){var a=+tx.amt,to=tx.to,d={},r;
if(to==="collect"){r=oth().map(function(p){return p.id});r.forEach(function(i){d[i]=-a});if(tx.from!=="bank")d[tx.from]=a*r.length}
else{r=to==="all"?oth().map(function(p){return p.id}):[to];if(tx.from!=="bank")d[tx.from]=-a*r.length;r.forEach(function(i){if(i!=="bank")d[i]=(d[i]||0)+a})}
var id=commit({ty:to==="collect"?"col":"pay",f:tx.from,t:to,a:a,d:d,r:r});tx=null;toast("پرداخت موفق","ok",id);runAnim(OLD)}

function cards(d){var c=(S.cards&&S.cards[d]&&S.cards[d].length===16)?S.cards[d].slice():DEF[d].slice();c[JI[d]]=DEF[d][JI[d]];return c}

function drawCard(d){S.dk=S.dk||{};S.lc=S.lc||{};var q=S.dk[d];
if(!q||!q.length){q=[];for(var i=0;i<16;i++)if(!(i===JI[d]&&S.jail[d]))q.push(i);for(var j=q.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=q[j];q[j]=q[k];q[k]=t}if(q[q.length-1]===S.lc[d])q.unshift(q.pop())}
